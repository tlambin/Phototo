<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Phototo — Galerie Photo & Vidéo IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="/static/css/theme.css" />
</head>
<body class="h-screen flex overflow-hidden select-none">

    <!-- Barre latérale pleine hauteur avec panneau verre miroir de la navbar -->
    <div class="h-full flex shrink-0">
        {% include "components/sidebar.html" %}
    </div>

    <!-- Corps principal : Topbar flottante à fond verre dépoli au-dessus du conteneur défilant -->
    <div class="flex-1 relative h-full overflow-hidden">
        {% include "components/topbar.html" %}
        {% include "components/views.html" %}
        <div class="scroll-fade-bottom"></div>
    </div>

    <!-- Fenêtres modales (Lightbox, Assistant Import, Studio, EXIF, Visages) -->
    {% include "components/modals.html" %}

    <!-- Scripts modulaires -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/libraries.js"></script>
    <script src="/static/js/import_wizard.js"></script>
    <script src="/static/js/gallery.js"></script>
    <script src="/static/js/ai_views.js"></script>
    <script src="/static/js/studio_exif.js"></script>
</body>
</html>
