<header id="floating-topbar" class="absolute top-0 left-0 right-0 h-20 pl-5 pr-[20px] flex items-center justify-between gap-4 z-30 pointer-events-none">
    <!-- Barre de recherche flottante + bouton Options au scroll à gauche -->
    <div class="flex-1 flex items-center gap-2.5 min-w-0 pointer-events-auto">
        <div class="w-full max-w-md relative flex items-center">
            <svg class="w-4 h-4 absolute left-4 z-10 opacity-60 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>
            </svg>
            <input id="global-search-input" type="text" placeholder="Rechercher..."
                   onkeydown="if(event.key==='Enter') runGlobalSearch()"
                   class="ui-card w-full rounded-full pl-11 pr-4 py-2.5 text-sm outline-none shadow-sm focus:ring-2 focus:ring-current/25"/>
        </div>
        <button id="topbar-options-btn" type="button" onclick="toggleActiveOptionsBar()" title="Afficher/Masquer les options"
                class="hidden ui-card w-10 h-10 rounded-full items-center justify-center hover:opacity-85 transition select-none shrink-0 cursor-pointer">
            <svg class="w-4 h-4 opacity-85" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2" fill="currentColor"/></svg>
        </button>
    </div>

    <div class="relative flex items-center gap-3 pointer-events-auto">
        <!-- Pilule Activité en cours (visible uniquement quand une tâche tourne/est en pause) + Notifications -->
        <div id="activity-notif-pill" class="ui-card rounded-full p-0.5 flex items-center shadow-sm transition-all">
            <button id="activity-status-btn" type="button" onclick="toggleTaskPopover(event)" title="Détails de l'activité en cours"
                    class="hidden items-center gap-1.5 text-[11px] font-semibold opacity-85 hover:opacity-100 pr-1 max-w-[175px] transition cursor-pointer">
                <span id="pulse-badge" class="hidden w-2 h-2 rounded-full bg-emerald-400 shrink-0 animate-pulse"></span>
                <span id="activity-status-text" class="truncate"></span>
            </button>
            <button id="notif-bell-btn" type="button" onclick="toggleNotificationsPopover(event)" title="Notifications d'activités"
                    class="plum-btn w-7 h-7 rounded-full flex items-center justify-center shadow transition relative shrink-0 cursor-pointer">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span id="notif-unread-dot" class="hidden absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-rose-500 ring-2 ring-white"></span>
            </button>
        </div>

            <!-- Bouton Bibliothèque (1ère lettre par défaut ou image personnalisée, aligné verticalement avec Options et Timeline) -->
            <button id="lib-avatar-btn" type="button" onclick="toggleLibMenuPopover(event)" title="Gérer les bibliothèques"
                    class="ui-card w-11 h-11 rounded-full flex items-center justify-center hover:opacity-90 transition relative shadow-sm shrink-0 overflow-hidden cursor-pointer">
                <span id="lib-avatar-letter" class="text-base font-extrabold uppercase select-none leading-none">B</span>
                <img id="lib-avatar-img" src="" alt="" class="hidden w-full h-full object-cover"/>
            </button>
            <input id="lib-icon-file-input" type="file" accept="image/*" class="hidden" onchange="uploadActiveLibraryIcon(this)"/>

            <!-- POPOVER CLOCHE : NOTIFICATIONS DES ACTIVITÉS TERMINÉES / ÉCHOUÉES -->
            <div id="notif-popover" class="hidden absolute right-14 top-14 w-80 ui-card rounded-3xl shadow-2xl p-4 z-50 space-y-3" onclick="event.stopPropagation()">
                <div class="flex items-center justify-between pb-2">
                    <span class="text-xs font-extrabold uppercase tracking-wider">Notifications</span>
                    <button onclick="switchTab('activities'); document.getElementById('notif-popover').classList.add('hidden')" class="text-[11px] font-bold opacity-80 hover:opacity-100 hover:underline">
                        Tout voir
                    </button>
                </div>
                <div class="h-px ui-divider w-full"></div>
                <div id="notif-popover-list" class="space-y-2 max-h-64 overflow-y-auto text-xs">
                    <div class="py-4 text-center opacity-60 font-semibold">Aucune activité récente</div>
                </div>
            </div>

            <!-- POPOVER BIBLIOTHÈQUE : SÉLECTEUR + IMAGE + CRÉER / FUSIONNER / MODIFIER -->
            <div id="lib-menu-popover" class="hidden absolute right-0 top-14 w-72 ui-card rounded-3xl shadow-2xl p-4 z-50" onclick="event.stopPropagation()">
                <div class="flex items-center gap-2.5 mb-3">
                    <button type="button" onclick="triggerLibraryIconUpload()" title="Choisir une image pour cette bibliothèque"
                            class="plum-btn w-10 h-10 rounded-full flex items-center justify-center shrink-0 overflow-hidden shadow relative group cursor-pointer">
                        <span id="lib-pop-avatar-letter" class="text-sm font-extrabold uppercase select-none leading-none">B</span>
                        <img id="lib-pop-avatar-img" src="" alt="" class="hidden w-full h-full object-cover"/>
                        <span class="opacity-0 group-hover:opacity-100 absolute inset-0 bg-black/55 text-white flex items-center justify-center transition-opacity duration-150">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                <path d="M12 20h9"/>
                                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                            </svg>
                        </span>
                    </button>
                    <div class="ui-pill rounded-full px-3.5 py-2 flex-1 min-w-0 flex items-center justify-between">
                        <select id="library-selector" onchange="switchLibrary(this.value)"
                                class="bg-transparent font-extrabold text-xs w-full outline-none cursor-pointer truncate"></select>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <button onclick="openLibraryModal('CREATE')" class="flex flex-col items-center gap-1.5 p-2 rounded-2xl hover:opacity-85 transition">
                        <div class="plum-btn w-12 h-12 rounded-2xl flex items-center justify-center shadow">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
                        </div>
                        <span class="text-xs font-extrabold">Créer</span>
                    </button>
                    <button onclick="openMergeLibrariesModal()" class="flex flex-col items-center gap-1.5 p-2 rounded-2xl hover:opacity-85 transition">
                        <div class="plum-btn w-12 h-12 rounded-2xl flex items-center justify-center shadow">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        </div>
                        <span class="text-xs font-extrabold">Fusionner</span>
                    </button>
                    <button onclick="openLibraryModal('EDIT')" class="flex flex-col items-center gap-1.5 p-2 rounded-2xl hover:opacity-85 transition">
                        <div class="plum-btn w-12 h-12 rounded-2xl flex items-center justify-center shadow">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                        </div>
                        <span class="text-xs font-extrabold">Modifier</span>
                    </button>
                </div>
            </div>

            <!-- POPOVER ACTIVITÉ EN COURS (Pause, Console, Stop) -->
            <div id="task-popover" class="hidden absolute right-24 top-14 w-96 z-50 space-y-3" onclick="event.stopPropagation()">
                <div class="ui-card rounded-3xl shadow-2xl p-5 relative">
                    <div id="task-empty-state" class="text-center space-y-4 py-2">
                        <div class="text-base font-extrabold">Aucune tâche en cours</div>
                        <button onclick="runTask('INGEST')" class="plum-btn w-full py-2.5 rounded-full text-xs font-bold shadow">
                            Lancer une analyse
                        </button>
                    </div>

                    <div id="task-active-state" class="hidden space-y-3.5">
                        <div id="pop-step-title" class="text-base font-extrabold text-center truncate">Decompression en cours...</div>
                        <div class="w-full ui-pill rounded-full h-3.5 overflow-hidden relative">
                            <div id="pipe-bar" class="h-full transition-all duration-300" style="width:0%; background-color: var(--accent-bar);"></div>
                            <span id="pop-percent-text" class="absolute inset-0 flex items-center justify-center text-[10px] font-extrabold text-white drop-shadow">0 %</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-center text-[10px] font-bold">
                            <div class="ui-pill rounded-2xl py-1.5 px-2 truncate" id="pop-files-pill">0 / 0<br>fichiers</div>
                            <div class="ui-pill rounded-2xl py-1.5 px-2 truncate" id="pop-eta-pill">Temps restant estimé<br>--:--</div>
                            <div class="ui-pill rounded-2xl py-1.5 px-2 flex items-center justify-center truncate" id="pop-speed-pill">-- Mo/s</div>
                        </div>
                        <div class="flex justify-center items-center gap-4 pt-1 relative">
                            <button id="btn-pause-pipe" onclick="handlePipeActionButton()" title="Mettre en pause / Reprendre"
                                    class="plum-btn w-10 h-10 rounded-2xl flex items-center justify-center shadow">
                                <svg id="icon-pause-bars" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                    <rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>
                                </svg>
                                <span id="icon-play-triangle" class="hidden text-sm font-bold">▶</span>
                            </button>
                            <button onclick="document.getElementById('pipe-logs-box').classList.toggle('hidden')" title="Afficher la console"
                                    class="plum-btn w-10 h-10 rounded-2xl flex items-center justify-center font-mono text-sm font-extrabold shadow">
                                &gt;_
                            </button>
                            <button onclick="stopPipelineCompletely()" title="Arrêter complètement la tâche"
                                    class="plum-btn w-10 h-10 rounded-2xl flex items-center justify-center shadow">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                    <rect x="6" y="6" width="12" height="12" rx="1.5"/>
                                </svg>
                            </button>
                            <button id="btn-task-warning" onclick="toggleTaskMissingMetaSubpanel(event)" title="Certaines métadonnées sont manquantes"
                                    class="hidden absolute right-1 bottom-0.5 text-amber-500 hover:scale-110 transition">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                                    <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                                </svg>
                            </button>
                        </div>
                        <div id="pipe-logs-box" class="hidden mt-2 bg-[#262626] text-emerald-400 rounded-2xl p-3 font-mono text-[10px] h-36 overflow-y-auto select-text shadow-inner"></div>
                    </div>
                </div>

                <div id="task-missing-meta-popover" class="hidden ui-card rounded-3xl shadow-2xl p-5 space-y-3 relative">
                    <div class="text-sm font-extrabold">Certaines metadonnées sont manquantes</div>
                    <div id="task-missing-meta-list" class="text-[11px] font-semibold opacity-60 space-y-1 max-h-28 overflow-y-auto font-mono"></div>
                    <div class="flex justify-end pt-1">
                        <button id="btn-popover-retry-meta" onclick="retryMissingMetadataFromPopover()"
                                class="plum-btn px-6 py-1.5 rounded-full text-xs font-bold shadow">
                            Réessayer
                        </button>
                    </div>
                </div>
            </div>
        </div>
</header>
