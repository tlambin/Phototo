<header id="floating-topbar" class="absolute top-0 left-0 right-0 h-20 pl-5 pr-[20px] flex items-center justify-between gap-4 z-30 pointer-events-none">
    <!-- Barre de recherche flottante + bouton Options au scroll à gauche -->
    <div class="flex-1 flex items-center gap-2.5 min-w-0 pointer-events-auto">
        <div class="w-full max-w-md relative flex items-center">
            <svg class="w-4 h-4 absolute left-4 z-10 opacity-60 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>
            </svg>
            <input id="global-search-input" type="text" placeholder="Rechercher..."
                   onkeydown="if(event.key==='Enter') runGlobalSearch()"
                   class="ui-card w-full rounded-full pl-11 pr-4 py-2.5 text-sm outline-none shadow-sm focus:ring-2 focus:ring-current/25"/>
        </div>
        <button id="topbar-options-btn" type="button" onclick="toggleActiveOptionsBar()" title="Afficher/Masquer les options"
                class="hidden ui-card w-10 h-10 rounded-full items-center justify-center hover:opacity-85 transition select-none shrink-0 cursor-pointer">
            <svg class="w-4 h-4 opacity-85" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
    </div>

    <div class="relative flex items-center gap-3 pointer-events-auto">
        <!-- Pilule Activité en cours (visible uniquement quand une tâche tourne/est en pause) + Notifications -->
        <div id="activity-notif-pill" class="ui-card rounded-full p-0.5 flex items-center shadow-sm transition-all">
            <button id="activity-status-btn" type="button" onclick="toggleTaskPopover(event)" title="Détails de l'activité en cours"
                    class="hidden items-center gap-1.5 text-[11px] font-semibold opacity-85 hover:opacity-100 pr-1 max-w-[175px] transition cursor-pointer">
                <span id="pulse-badge" class="hidden w-2 h-2 rounded-full bg-emerald-400 shrink-0 animate-pulse"></span>
                <span id="activity-status-text" class="truncate"></span>
            </button>
            <button id="notif-bell-btn" type="button" onclick="toggleNotificationsPopover(event)" title="Notifications d'activités"
                    class="plum-btn w-7 h-7 rounded-full flex items-center justify-center shadow transition relative shrink-0 cursor-pointer">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span id="notif-unread-dot" class="hidden absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-rose-500 ring-2 ring-white"></span>
            </button>
        </div>

            <!-- Bouton Bibliothèque (1ère lettre par défaut ou image personnalisée, aligné verticalement avec Options et Timeline) -->
            <button id="lib-avatar-btn" type="button" onclick="toggleLibMenuPopover(event)" title="Gérer les bibliothèques"
                    class="ui-card w-11 h-11 rounded-full flex items-center justify-center hover:opacity-90 transition relative shadow-sm shrink-0 overflow-hidden cursor-pointer">
                <span id="lib-avatar-letter" class="text-base font-extrabold uppercase select-none leading-none">B</span>
                <img id="lib-avatar-img" src="" alt="" class="hidden w-full h-full object-cover"/>
            </button>
            <input id="lib-icon-file-input" type="file" accept="image/*" class="hidden" onchange="uploadActiveLibraryIcon(this)"/>

            <!-- POPOVER CLOCHE : NOTIFICATIONS DES ACTIVITÉS TERMINÉES / ÉCHOUÉES -->
            <div id="notif-popover" class="hidden absolute right-14 top-14 w-80 ui-card rounded-3xl shadow-2xl p-4 z-50 space-y-3" onclick="event.stopPropagation()">
                <div class="flex items-center justify-between gap-2 pb-1">
                    <span class="text-xs font-extrabold uppercase tracking-wider">Notifications</span>
                    <button id="btn-clear-all-notifs" type="button" onclick="clearAllNotifications(event)" title="Effacer toutes les notifications"
                            class="hidden ui-pill hover:bg-[var(--bg-hover)] hover:text-rose-500 px-2.5 py-0.5 rounded-full text-[10px] font-bold transition cursor-pointer">
                        Tout effacer
                    </button>
                </div>
                <div class="h-px ui-divider w-full"></div>
                <div id="notif-popover-list" class="space-y-2 max-h-64 overflow-y-auto text-xs">
                    <div class="py-4 text-center opacity-60 font-semibold">Aucune activité récente</div>
                </div>
            </div>

            <!-- POPOVER BIBLIOTHÈQUE : SÉLECTEUR + IMAGE + ACTIONS -->
            <div id="lib-menu-popover" class="hidden absolute right-0 top-14 w-64 ui-card rounded-3xl shadow-2xl p-3.5 z-50 space-y-2.5" onclick="event.stopPropagation()">
                <div class="flex items-center gap-2.5">
                    <button type="button" onclick="triggerLibraryIconUpload()" title="Choisir une image pour cette bibliothèque"
                            class="plum-btn w-9 h-9 rounded-full flex items-center justify-center shrink-0 overflow-hidden shadow relative group cursor-pointer">
                        <span id="lib-pop-avatar-letter" class="text-xs font-extrabold uppercase select-none leading-none">B</span>
                        <img id="lib-pop-avatar-img" src="" alt="" class="hidden w-full h-full object-cover"/>
                        <span class="opacity-0 group-hover:opacity-100 absolute inset-0 bg-black/55 text-white flex items-center justify-center transition-opacity duration-150">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                <path d="M12 20h9"/>
                                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                            </svg>
                        </span>
                    </button>
                    <div class="ui-pill rounded-full px-3 py-1.5 flex-1 min-w-0 relative flex items-center">
                        <select id="library-selector" onchange="switchLibrary(this.value)"
                                class="appearance-none bg-transparent font-extrabold text-xs w-full pr-4 outline-none cursor-pointer truncate"></select>
                        <svg class="w-3 h-3 opacity-60 pointer-events-none absolute right-3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                </div>
                <div class="h-px ui-divider w-full"></div>
                <div class="space-y-1">
                    <button type="button" onclick="openLibraryModal('CREATE')"
                            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-[var(--bg-hover)] text-xs font-bold transition cursor-pointer">
                        <svg class="w-4 h-4 shrink-0 opacity-75" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
                        <span>Créer une bibliothèque</span>
                    </button>
                    <button type="button" onclick="openLibraryModal('EDIT')"
                            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-[var(--bg-hover)] text-xs font-bold transition cursor-pointer">
                        <svg class="w-4 h-4 shrink-0 opacity-75" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                        <span>Modifier la bibliothèque</span>
                    </button>
                    <button type="button" onclick="openMergeLibrariesModal()"
                            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-[var(--bg-hover)] text-xs font-bold transition cursor-pointer">
                        <svg class="w-4 h-4 shrink-0 opacity-75" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        <span>Fusionner des bibliothèques</span>
                    </button>
                </div>
            </div>

            <!-- POPOVER ACTIVITÉ EN COURS (Pause, Console, Stop) -->
            <div id="task-popover" class="hidden absolute right-14 top-14 w-80 z-50 space-y-2.5" onclick="event.stopPropagation()">
                <div class="ui-card rounded-3xl shadow-2xl p-4 relative">
                    <div id="task-empty-state" class="text-center space-y-3 py-1">
                        <div class="w-9 h-9 rounded-2xl ui-pill mx-auto flex items-center justify-center opacity-75">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        </div>
                        <div class="text-xs font-extrabold">Aucune tâche en cours</div>
                        <button type="button" onclick="runTask('INGEST')" title="Scanner les dossiers sources pour importer les nouveaux médias ou reprendre un import interrompu" class="plum-btn w-full py-2 rounded-full text-xs font-bold shadow-sm cursor-pointer">
                            Scanner
                        </button>
                    </div>

                    <div id="task-active-state" class="hidden space-y-3">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 min-w-0">
                                <span id="pop-status-dot" class="w-2 h-2 rounded-full bg-emerald-400 shrink-0 animate-pulse"></span>
                                <div id="pop-step-title" class="text-xs font-extrabold truncate">Analyse en cours...</div>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <span id="pop-percent-text" class="text-[11px] font-extrabold tabular-nums opacity-85">0 %</span>
                            </div>
                        </div>

                        <div class="w-full ui-pill rounded-full h-2 overflow-hidden">
                            <div id="pipe-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width:0%;"></div>
                        </div>

                        <div class="space-y-1.5">
                            <div id="pop-files-row" class="flex items-center gap-1.5">
                                <div id="pop-files-pill" class="ui-pill rounded-xl py-1.5 px-3 flex-1 min-w-0 flex items-center justify-between gap-2 text-[11px] font-bold">
                                    <span class="opacity-70 truncate">Fichiers traités</span>
                                    <span class="font-extrabold tabular-nums shrink-0">0 / 0</span>
                                </div>
                                <button id="btn-task-warning" type="button" onclick="toggleTaskMissingMetaSubpanel(event)" title="Certaines métadonnées sont manquantes"
                                        class="hidden w-8 h-8 rounded-xl ui-pill text-amber-500 hover:bg-amber-500/15 flex items-center justify-center shrink-0 transition cursor-pointer">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                                        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="grid grid-cols-2 gap-1.5 text-center text-[10px] font-bold leading-tight">
                                <div class="ui-pill rounded-xl py-1.5 px-2 truncate" id="pop-eta-pill">Temps restant<br>--:--</div>
                                <div class="ui-pill rounded-xl py-1.5 px-2 truncate" id="pop-speed-pill">Vitesse<br>-- Mo/s</div>
                            </div>
                        </div>

                        <div class="h-px ui-divider w-full"></div>

                        <div class="grid grid-cols-3 gap-1.5">
                            <button id="btn-pause-pipe" type="button" onclick="handlePipeActionButton()" title="Mettre en pause / Reprendre"
                                    class="ui-pill hover:bg-[var(--bg-hover)] hover:text-amber-500 py-1.5 px-2.5 rounded-full flex items-center justify-center gap-1.5 text-[11px] font-bold transition cursor-pointer">
                                <svg id="icon-pause-bars" class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                    <rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>
                                </svg>
                                <svg id="icon-play-triangle" class="hidden w-3.5 h-3.5 shrink-0" fill="currentColor" viewBox="0 0 24 24">
                                    <polygon points="6 4 20 12 6 20 6 4"/>
                                </svg>
                                <span id="label-pause-pipe">Pause</span>
                            </button>
                            <button id="btn-console-pipe" type="button" onclick="document.getElementById('pipe-logs-box').classList.toggle('hidden')" title="Afficher la console"
                                    class="ui-pill hover:bg-[var(--bg-hover)] hover:text-sky-500 py-1.5 px-2.5 rounded-full flex items-center justify-center gap-1.5 text-[11px] font-bold transition cursor-pointer">
                                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                    <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
                                </svg>
                                <span>Console</span>
                            </button>
                            <button id="btn-stop-pipe" type="button" onclick="stopPipelineCompletely()" title="Arrêter complètement la tâche"
                                    class="ui-pill hover:bg-[var(--bg-hover)] hover:text-rose-500 py-1.5 px-2.5 rounded-full flex items-center justify-center gap-1.5 text-[11px] font-bold transition cursor-pointer">
                                <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 24 24">
                                    <rect x="5" y="5" width="14" height="14" rx="2"/>
                                </svg>
                                <span>Arrêter</span>
                            </button>
                        </div>
                        <div id="pipe-logs-box" class="hidden bg-black/85 text-emerald-400 border border-[var(--border-subtle)] rounded-2xl p-2.5 font-mono text-[10px] leading-relaxed h-32 overflow-y-auto select-text shadow-inner"></div>
                    </div>
                    <div id="task-preflight-warning" class="hidden mt-3 rounded-2xl border border-amber-500/35 bg-amber-500/10 p-3 space-y-2 text-[11px]">
                        <div class="font-extrabold text-amber-400">⚠️ Espace disque insuffisant détecté</div>
                        <div id="task-preflight-warning-text" class="opacity-85 leading-snug font-semibold"></div>
                        <div class="flex items-center justify-end gap-2 pt-0.5">
                            <button type="button" onclick="cancelPendingPreflightTask()"
                                    class="ui-pill hover:bg-[var(--bg-hover)] px-3 py-1 rounded-full font-bold cursor-pointer">
                                Annuler
                            </button>
                            <button type="button" onclick="confirmPendingPreflightTask()"
                                    class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded-full font-bold cursor-pointer">
                                Continuer quand même
                            </button>
                        </div>
                    </div>
                </div>

                <div id="task-missing-meta-popover" class="hidden ui-card rounded-3xl shadow-2xl p-4 space-y-2.5 relative">
                    <div class="text-xs font-extrabold">Certaines métadonnées sont manquantes</div>
                    <div id="task-missing-meta-list" class="text-[11px] font-semibold opacity-65 space-y-1 max-h-28 overflow-y-auto font-mono"></div>
                    <div class="flex justify-end pt-0.5">
                        <button id="btn-popover-retry-meta" type="button" onclick="retryMissingMetadataFromPopover()"
                                class="plum-btn px-4 py-1.5 rounded-full text-xs font-bold shadow cursor-pointer">
                            Réessayer
                        </button>
                    </div>
                </div>
            </div>
        </div>
</header>
