<!-- ==================== VISIONNEUSE PLEIN ÉCRAN (LIGHTBOX) ==================== -->
<div id="lightbox-modal" class="hidden fixed inset-0 z-50 bg-[#181818]/95 backdrop-blur-md flex items-center justify-center p-6 select-none" onclick="if(event.target===this) closeLightbox()">

    <!-- Bouton Fermer (Haut Gauche) & Flèches Navigation -->
    <button onclick="closeLightbox()" title="Fermer (Échap)"
            class="fixed top-5 left-5 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition z-50">
        ✕
    </button>
    <button onclick="event.stopPropagation(); navigateLightbox(-1)" title="Précédent (←)"
            class="fixed left-5 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/10 hover:bg-white/25 text-white flex items-center justify-center text-xl transition z-50">
        ‹
    </button>
    <button onclick="event.stopPropagation(); navigateLightbox(1)" title="Suivant (→)"
            class="fixed right-5 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/10 hover:bg-white/25 text-white flex items-center justify-center text-xl transition z-50">
        ›
    </button>

    <!-- Conteneur Principal : Média à gauche/centre + Tiroir Informations à droite -->
    <div class="w-full h-full flex items-center justify-center gap-8 max-w-[1600px] mx-auto overflow-hidden">

        <!-- COLONNE CENTRALE : Cadre Photo/Vidéo Adaptatif + Barre des 7 Boutons -->
        <div class="flex-1 h-full flex flex-col items-center justify-center min-w-0" onclick="if(event.target===this) closeLightbox()">
            <div class="relative flex items-center justify-center max-h-[82vh] max-w-full">
                <img id="lb-img" src="" alt=""
                     class="max-h-[80vh] max-w-full w-auto h-auto object-contain rounded-[28px] shadow-[0_0_35px_rgba(255,255,255,0.12)] bg-[#ECECEC] transition-all duration-200"/>
                <video id="lb-video" controls
                       class="hidden max-h-[80vh] max-w-full w-auto h-auto object-contain rounded-[28px] shadow-[0_0_35px_rgba(255,255,255,0.12)] bg-black"></video>
            </div>

            <!-- BARRE D'OUTILS BASSE (7 Boutons Ronds Blancs) -->
            <div id="lb-bottom-toolbar" class="mt-5 flex items-center gap-4 z-20">
                <!-- 1. Modifier (Studio Photo/Vidéo) -->
                <button onclick="lightboxOpenStudio()" title="Modifier le média"
                        class="w-11 h-11 rounded-full bg-[#ECECEC] hover:bg-white text-[#1E1E1E] shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center hover:scale-105 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
                    </svg>
                </button>

                <!-- 2. Ajouter à un album -->
                <button onclick="lightboxAddToAlbum()" title="Ajouter à un album"
                        class="w-11 h-11 rounded-full bg-[#ECECEC] hover:bg-white text-[#1E1E1E] shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center hover:scale-105 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                        <path d="M12 11v6M9 14h6"/>
                    </svg>
                </button>

                <!-- 3. Partager -->
                <button onclick="lightboxShareMedia()" title="Partager"
                        class="w-11 h-11 rounded-full bg-[#ECECEC] hover:bg-white text-[#1E1E1E] shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center hover:scale-105 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                    </svg>
                </button>

                <!-- 4. Télécharger -->
                <button onclick="lightboxDownloadMedia()" title="Télécharger"
                        class="w-11 h-11 rounded-full bg-[#ECECEC] hover:bg-white text-[#1E1E1E] shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center hover:scale-105 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </button>

                <!-- 5. Mettre en favori -->
                <button id="lb-btn-fav" onclick="lightboxToggleFavorite()" title="Mettre en favori"
                        class="w-11 h-11 rounded-full bg-[#ECECEC] hover:bg-white text-[#1E1E1E] shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center hover:scale-105 transition">
                    <svg id="lb-fav-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.3l7.8-7.8 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
                    </svg>
                </button>

                <!-- 6. Supprimer -->
                <button onclick="lightboxDeleteMedia()" title="Mettre à la corbeille"
                        class="w-11 h-11 rounded-full bg-[#ECECEC] hover:bg-white text-[#1E1E1E] shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center hover:scale-105 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
                    </svg>
                </button>

                <!-- 7. Informations -->
                <button id="lb-btn-info" onclick="toggleLightboxInfoDrawer()" title="Afficher les informations"
                        class="w-11 h-11 rounded-full bg-[#ECECEC] hover:bg-white text-[#1E1E1E] shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center hover:scale-105 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- COLONNE DROITE : PANNEAU INFORMATIONS -->
        <aside id="lb-info-drawer" class="hidden w-80 shrink-0 h-full max-h-[92vh] flex flex-col justify-between items-center py-2 overflow-y-auto no-scrollbar text-[#181818]">
            <div class="w-full space-y-3.5 flex flex-col items-center">
                <!-- En-tête Pilule "Informations" (Cliquer pour refermer) -->
                <button onclick="toggleLightboxInfoDrawer()"
                        class="bg-[#ECECEC] hover:bg-white px-9 py-2 rounded-full text-sm font-extrabold shadow-[0_0_20px_rgba(255,255,255,0.18)] transition">
                    Informations
                </button>

                <!-- Carte 1 : Nom fichier, Mpx/Dimensions, Date/Heure, Appareil/EXIF, Poids Mo -->
                <div class="w-64 bg-[#ECECEC] rounded-[24px] p-4 shadow-[0_0_20px_rgba(255,255,255,0.14)] space-y-2.5 text-left">
                    <div>
                        <div id="lb-info-filename" class="text-xs font-extrabold truncate">IMG.jpg</div>
                        <div id="lb-info-dims" class="text-[10px] font-semibold opacity-70">12 Mpx 3000 x 4000</div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] font-bold opacity-75">
                            <span id="lb-info-weekday">Samedi</span>
                            <span id="lb-info-time">15h52</span>
                        </div>
                        <div id="lb-info-date" class="text-xs font-extrabold">31 octobre 2026</div>
                    </div>
                    <div>
                        <div id="lb-info-camera" class="text-xs font-extrabold truncate">Appareil photo</div>
                        <div id="lb-info-lens" class="text-[10px] font-semibold opacity-75"></div>
                    </div>
                    <div class="text-[9px] font-bold opacity-60">plus de details</div>
                    <div id="lb-info-size" class="text-xs font-extrabold">0,00 Mo</div>
                </div>

                <!-- Carte 2 : Album -->
                <div onclick="lightboxAddToAlbum()" class="w-64 bg-[#ECECEC] hover:bg-white cursor-pointer rounded-[20px] px-4 py-2.5 shadow-[0_0_20px_rgba(255,255,255,0.14)] flex items-center gap-3 transition">
                    <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    </svg>
                    <div class="min-w-0 text-left">
                        <div id="lb-info-album-name" class="text-xs font-extrabold truncate">Aucun album</div>
                        <div id="lb-info-album-count" class="text-[10px] font-semibold opacity-70">Cliquer pour ajouter</div>
                    </div>
                </div>

                <!-- Carte 3 : Personnes -->
                <div class="w-64 bg-[#ECECEC] rounded-[22px] p-3 shadow-[0_0_20px_rgba(255,255,255,0.14)] text-center space-y-2">
                    <div class="text-xs font-extrabold">Personnes</div>
                    <div id="lb-info-faces-list" class="flex items-center justify-center gap-3 flex-wrap"></div>
                </div>

                <!-- Carte 4 : Lieu & Mini-Carte -->
                <div class="w-64 bg-[#ECECEC] rounded-[22px] p-3 shadow-[0_0_20px_rgba(255,255,255,0.14)] text-center space-y-2">
                    <div id="lb-info-place-title" class="text-xs font-extrabold truncate">Lieu inconnu</div>
                    <div id="lb-mini-map" class="w-full h-24 rounded-[16px] bg-[#2B2929] overflow-hidden relative flex items-center justify-center text-[10px] text-white/60 font-bold">
                        Aucune coordonnée GPS
                    </div>
                </div>

                <!-- Carte 5 : Note -->
                <div onclick="lightboxOpenMetadataEditor()" class="w-64 bg-[#ECECEC] hover:bg-white cursor-pointer rounded-[20px] p-3 shadow-[0_0_20px_rgba(255,255,255,0.14)] text-center space-y-1 transition">
                    <div class="text-xs font-extrabold">Note</div>
                    <div id="lb-info-note" class="text-[11px] font-semibold opacity-70 truncate min-h-[18px]">Ajouter une note...</div>
                </div>

                <!-- 3 Boutons Ronds Bas du Panneau Info (Modifier EXIF, Album, Supprimer) -->
                <div class="flex items-center justify-center gap-5 pt-1">
                    <button onclick="lightboxOpenMetadataEditor()" title="Modifier la date, le lieu ou la note"
                            class="w-10 h-10 rounded-full bg-[#ECECEC] hover:bg-white text-[#1E1E1E] shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center hover:scale-105 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                    <button onclick="lightboxAddToAlbum()" title="Assigner à un album"
                            class="w-10 h-10 rounded-full bg-[#ECECEC] hover:bg-white text-[#1E1E1E] shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center hover:scale-105 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                            <path d="M12 11v6M9 14h6"/>
                        </svg>
                    </button>
                    <button onclick="lightboxDeleteMedia()" title="Supprimer le média"
                            class="w-10 h-10 rounded-full bg-[#ECECEC] hover:bg-white text-[#1E1E1E] shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center hover:scale-105 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Pilule Chemin du Fichier tout en bas -->
            <div id="lb-info-path-pill" title=""
                 class="w-72 mt-3 bg-[#ECECEC] rounded-full px-4 py-1.5 text-[11px] font-extrabold truncate shadow-[0_0_15px_rgba(255,255,255,0.18)] text-left">
                C:/Mes Photos/...
            </div>
        </aside>
    </div>
</div>
